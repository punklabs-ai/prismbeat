name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: macos-14
    defaults:
      run:
        working-directory: com.punklabs.prismbeat.sdPlugin
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: com.punklabs.prismbeat.sdPlugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build universal audio analyser
        run: npm run build:audio

      - name: Run tests
        run: npm test

  support:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: support-worker/package-lock.json

      - name: Check support Worker
        working-directory: support-worker
        run: |
          npm ci
          npm run types
          npm run typecheck
          npm run deploy:check
