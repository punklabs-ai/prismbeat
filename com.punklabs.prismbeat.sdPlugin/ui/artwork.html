<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spotify Artwork</title>
    <link rel="stylesheet" href="artwork.css">
  </head>
  <body>
    <main>
      <label for="artwork-position">Artwork shown on this button</label>
      <select id="artwork-position">
        <option value="single">Full cover — single button</option>
        <option value="auto">Mosaic — Automatic</option>
        <option value="top-left">Mosaic — Top left</option>
        <option value="top-right">Mosaic — Top right</option>
        <option value="bottom-left">Mosaic — Bottom left</option>
        <option value="bottom-right">Mosaic — Bottom right</option>
      </select>
      <p>For a 2 × 2 cover, place four Artwork actions in an adjacent square and choose Automatic on every button. Use an explicit corner only when you want a custom arrangement.</p>
    </main>
    <script src="artwork.js"></script>
  </body>
</html>
