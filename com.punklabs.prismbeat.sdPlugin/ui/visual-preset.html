<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visual Preset</title>
    <link rel="stylesheet" href="artwork.css">
  </head>
  <body>
    <main>
      <label for="visual-index">Visual shown on this key</label>
      <select id="visual-index">
        <option value="0">1. Spectrum analyser</option>
        <option value="1">2. Triggered oscilloscope</option>
        <option value="2">3. Rectangular frequency tunnel</option>
        <option value="3">4. Audio warp starfield</option>
        <option value="4">5. Spectrum plasma clouds</option>
        <option value="5">6. Kaleidoscope petals</option>
        <option value="6">7. Elliptical spectrum halo</option>
        <option value="7">8. Neon spectrum terrain</option>
        <option value="8">9. Centre-origin spectrogram</option>
        <option value="9">10. Frequency particle fountain</option>
        <option value="10">11. True stereo vectorscope</option>
        <option value="11">12. Frequency lightning storm</option>
        <option value="12">13. Cymatic ripple pool</option>
        <option value="13">14. Frequency DNA helix</option>
        <option value="14">15. Pitch-class constellation</option>
        <option value="15">16. Frequency-driven digital rain</option>
        <option value="16">17. Synthwave outrun highway</option>
        <option value="17">18. Neon city cruise</option>
        <option value="18">19. Miami night run</option>
      </select>
      <p>The key shows a live square view of this visual. Press it to advance to the next visual; the selection wraps after number 19 and is saved automatically.</p>
    </main>
    <script src="visual-preset.js"></script>
  </body>
</html>
